<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cassette skin</title>
<style>
  /* Cassette "mixtape" skin — the entire screen IS the cassette.
     Now-playing track is written on the label; transport is printed on the shell.
     Everything sized in vmin so the tape fills the screen in any orientation. */
  :root{
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
    --grotesk:"Helvetica Neue",Arial,sans-serif;
    --marker:"Bradley Hand","Comic Sans MS",cursive;
    --red:#E5402A;
    --cream:#e9e6df;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;overflow:hidden;font-family:var(--grotesk)}

  .cassette{position:fixed;inset:0;background:#0c0b0a;color:var(--cream);overflow:hidden;
            display:flex;flex-direction:column;padding:3.4vmin;
            box-shadow:inset 0 .6vmin .8vmin rgba(255,255,255,.06)}

  /* label / now-playing sticker */
  .label{flex:0 0 34vmin;position:relative;background:#f5f3ee;border-radius:1.4vmin;
         overflow:hidden;color:#161514;box-shadow:0 .4vmin .8vmin rgba(0,0,0,.4)}
  .stripe{position:absolute;top:0;left:0;right:0;height:3vmin;background:var(--red)}
  .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:2vmin;
        letter-spacing:.04em;padding:4.6vmin 3.2vmin 0}
  .side{position:absolute;left:3.2vmin;top:9.4vmin;background:#161514;color:#f5f3ee;
        font-family:var(--grotesk);font-weight:700;font-size:3.6vmin;line-height:1;
        padding:.9vmin 1.2vmin;border-radius:.5vmin}
  .np{position:absolute;left:0;right:0;top:7vmin;text-align:center;font-family:var(--marker)}
  .np .t{font-size:11vmin;line-height:1;font-weight:700}
  .np .a{font-size:4.4vmin;line-height:1;margin-top:1.8vmin;color:#3a3833}

  /* black shell body: reels, printed controls, flavor text, lip holes */
  .body{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:4vmin;padding-bottom:15vmin}
  .deckrow{display:flex;align-items:center;justify-content:center;gap:5vmin;width:100%}
  .grille{width:19vmin;height:26vmin;
          background:repeating-linear-gradient(90deg,
                     rgba(255,255,255,.11) 0 .4vmin,transparent .4vmin 1.3vmin)}
  .deck{display:flex;align-items:center;gap:2vmin}
  .hub{width:22vmin;height:22vmin;border-radius:50%;background:var(--cream);position:relative;
       box-shadow:0 0 0 .4vmin rgba(0,0,0,.25),inset 0 0 1.4vmin rgba(0,0,0,.2);
       animation:spin 3.5s linear infinite}
  .hub::before{content:"";position:absolute;inset:2.8vmin;border-radius:50%;
       background:repeating-conic-gradient(#0d0d0d 0 15deg,var(--cream) 15deg 30deg)}
  .hub::after{content:"";position:absolute;inset:7vmin;border-radius:50%;background:#0d0d0d}
  .cwin{width:14vmin;height:20vmin;background:#080807;border-radius:1.8vmin;
        display:flex;align-items:center;justify-content:center;
        box-shadow:inset 0 0 0 .4vmin rgba(255,255,255,.08)}
  .spool{width:6vmin;height:16vmin;background:#f2f0ea;
         clip-path:polygon(0 0,100% 0,56% 50%,100% 100%,0 100%,44% 50%)}

  /* printed transport + counter */
  .player{width:min(64vmin,82%);display:flex;flex-direction:column;align-items:center;gap:2.4vmin}
  .bar{width:100%;height:.7vmin;background:rgba(255,255,255,.16);position:relative;border-radius:1vmin}
  .bar>i{position:absolute;left:0;top:0;height:100%;width:44%;background:var(--red);border-radius:1vmin}
  .bar>b{position:absolute;left:44%;top:50%;width:2vmin;height:2vmin;border-radius:50%;
         background:var(--red);transform:translate(-50%,-50%)}
  .times{width:100%;display:flex;justify-content:space-between;font-family:var(--mono);
         font-size:2vmin;color:#9a968d;letter-spacing:.05em}
  .ctrls{display:flex;align-items:center;gap:6vmin;margin-top:1vmin}
  .ctrls .ic{font-size:5vmin;font-family:var(--mono);color:var(--cream)}
  .play{width:9.5vmin;height:9.5vmin;border-radius:50%;background:var(--cream);color:#0c0b0a;
        display:flex;align-items:center;justify-content:center;font-size:4vmin}

  /* flavor + lip holes */
  .spec{position:absolute;left:0;right:16vmin;bottom:8vmin;text-align:center;
        font-size:2.4vmin;color:#d7d4cc;letter-spacing:.02em}
  .grade{position:absolute;right:1vmin;bottom:6.6vmin;display:flex;background:var(--red);
         color:#fff;font-weight:700;font-size:3.8vmin;line-height:1;border-radius:.5vmin;overflow:hidden}
  .grade b{padding:1.1vmin 1.1vmin 1.1vmin 1.6vmin}
  .grade i{padding:1.1vmin 1.6vmin;font-style:normal;border-left:.25vmin solid rgba(255,255,255,.55)}
  /* recessed lip plate with drilled holes */
  .holes{position:absolute;left:50%;bottom:1.4vmin;transform:translateX(-50%);
         display:flex;align-items:center;gap:2.2vmin;padding:1.4vmin 3.4vmin;border-radius:2vmin;
         background:rgba(0,0,0,.32);
         box-shadow:inset 0 .35vmin .5vmin rgba(0,0,0,.75),inset 0 -.2vmin .3vmin rgba(255,255,255,.05)}
  .holes b{width:1.8vmin;height:2.8vmin;border-radius:50%;
           background:radial-gradient(60% 45% at 50% 32%,#1a1714,#000 80%);
           box-shadow:inset 0 .3vmin .35vmin rgba(0,0,0,.9),0 .2vmin .25vmin rgba(255,255,255,.06)}
  .holes .gap{width:5vmin}
  @keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body>
  <div class="cassette">
    <div class="label">
      <div class="stripe"></div>
      <div class="meta"><span>ACOUSTIC CASSETTE</span><span>N.R.[&nbsp;&nbsp;] ☐IN ☐OUT</span></div>
      <span class="side">B</span>
      <div class="np">
        <div class="t">Midnight City</div>
        <div class="a">M83</div>
      </div>
    </div>

    <div class="body">
      <div class="deckrow">
        <div class="grille"></div>
        <div class="deck">
          <div class="hub"></div>
          <div class="cwin"><div class="spool"></div></div>
          <div class="hub"></div>
        </div>
        <div class="grille"></div>
      </div>

      <div class="player">
        <div class="bar"><i></i><b></b></div>
        <div class="times"><span>1:35</span><span>3:36</span></div>
        <div class="ctrls"><span class="ic">⟵</span><div class="play">▶</div><span class="ic">⟶</span></div>
      </div>

      <div class="spec">Normal Bias 120μsEQ</div>
      <div class="grade"><b>A</b><i>60</i></div>
      <div class="holes"><b></b><b></b><span class="gap"></span><b></b><b></b></div>
    </div>
  </div>
</body></html>
